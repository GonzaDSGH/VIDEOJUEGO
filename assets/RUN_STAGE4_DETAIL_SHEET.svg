<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="paperD" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#f3ead4"/>
      <stop offset="100%" stop-color="#e3d5b3"/>
    </radialGradient>
    <pattern id="hatchD" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(52)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#241b12" stroke-width="0.9" opacity="0.5"/>
    </pattern>
    <pattern id="crossHatchD" width="7" height="7" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#241b12" stroke-width="0.8" opacity="0.45" transform="rotate(45 3.5 3.5)"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#241b12" stroke-width="0.8" opacity="0.45" transform="rotate(-45 3.5 3.5)"/>
    </pattern>
    <pattern id="stipple" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#241b12" opacity="0.5"/>
      <circle cx="6" cy="6" r="0.9" fill="#241b12" opacity="0.5"/>
    </pattern>
    <filter id="glowD" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="url(#paperD)"/>
  <text x="600" y="46" text-anchor="middle" font-size="24" fill="#2a2015" letter-spacing="2">RÛN — ETAPA 4: LÁMINA DE DETALLE</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#5a4a34">Boceto de concepto — autoría Claude — close-ups e hispiración de materiales</text>

  <!-- ================= PANEL A: OJO IMPLANTADO ================= -->
  <g transform="translate(40,100)">
    <rect x="0" y="0" width="330" height="360" rx="10" fill="none" stroke="#c9b98d" stroke-width="1.5"/>
    <text x="165" y="-14" text-anchor="middle" font-size="15" fill="#2a2015">01 — OJO IMPLANTADO (close-up)</text>

    <!-- skin around eye -->
    <path d="M40,180 C40,120 90,70 165,70 C240,70 290,120 290,180 C290,240 240,290 165,290 C90,290 40,240 40,180 Z" fill="#c9925f"/>
    <path d="M40,180 C40,120 90,70 165,70 C240,70 290,120 290,180 C290,240 240,290 165,290 C90,290 40,240 40,180 Z" fill="url(#hatchD)" opacity="0.2"/>

    <!-- brow -->
    <path d="M100,120 C125,104 165,102 190,116" stroke="#5a3c22" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- skin-implant transition: stitched leather rim -->
    <circle cx="165" cy="185" r="62" fill="none" stroke="#4a2f1c" stroke-width="10" opacity="0.9"/>
    <g stroke="#2e1e10" stroke-width="2" opacity="0.8">
      <line x1="103" y1="185" x2="113" y2="185"/>
      <line x1="165" y1="123" x2="165" y2="133"/>
      <line x1="227" y1="185" x2="217" y2="185"/>
      <line x1="165" y1="247" x2="165" y2="237"/>
      <line x1="121" y1="141" x2="129" y2="149"/>
      <line x1="209" y1="141" x2="201" y2="149"/>
      <line x1="121" y1="229" x2="129" y2="221"/>
      <line x1="209" y1="229" x2="201" y2="221"/>
    </g>

    <!-- bone/ivory ring -->
    <circle cx="165" cy="185" r="48" fill="#e7dcc0" stroke="#4a2f1c" stroke-width="2.5"/>
    <!-- rupestre marks etched on the ring -->
    <g stroke="#4a2f1c" stroke-width="1.6" opacity="0.75" fill="none">
      <path d="M130,150 L138,162 M142,148 L148,160"/>
      <path d="M188,150 L182,162 M200,148 L194,160"/>
      <path d="M120,200 C128,206 138,206 144,200"/>
      <path d="M186,200 C192,206 202,206 210,200"/>
    </g>
    <!-- iris/glow core -->
    <circle cx="165" cy="185" r="24" fill="#cdeaf5" opacity="0.9" filter="url(#glowD)"/>
    <circle cx="165" cy="185" r="10" fill="#17171a"/>
    <circle cx="160" cy="180" r="3" fill="#ffffff" opacity="0.8"/>

    <text x="165" y="330" text-anchor="middle" font-size="11.5" fill="#3a2f20">Aro de hueso pulido, cosido a la piel con tendón.</text>
    <text x="165" y="346" text-anchor="middle" font-size="11.5" fill="#3a2f20">Marcas grabadas = lenguaje rupestre del sistema de rastreo.</text>
  </g>

  <!-- ================= PANEL B: ARTICULACIÓN PROTÉSICA ================= -->
  <g transform="translate(420,100)">
    <rect x="0" y="0" width="330" height="360" rx="10" fill="none" stroke="#c9b98d" stroke-width="1.5"/>
    <text x="165" y="-14" text-anchor="middle" font-size="15" fill="#2a2015">02 — ARTICULACIÓN PROTÉSICA (codo)</text>

    <path d="M60,40 C40,90 34,150 50,200 C40,250 44,300 70,335 C90,310 96,270 88,232 C104,214 112,188 104,160 C118,140 118,108 100,80 C88,58 74,46 60,40 Z" fill="#b98a5e"/>
    <path d="M60,40 C40,90 34,150 50,200 C40,250 44,300 70,335 C90,310 96,270 88,232 C104,214 112,188 104,160 C118,140 118,108 100,80 C88,58 74,46 60,40 Z" fill="url(#crossHatchD)" opacity="0.4"/>

    <!-- leather/tendon wrap bands -->
    <g fill="#4a2f1c">
      <rect x="30" y="150" width="90" height="16" rx="7" transform="rotate(8 75 158)"/>
      <rect x="34" y="176" width="86" height="12" rx="6" transform="rotate(6 77 182)"/>
    </g>
    <g stroke="#2e1e10" stroke-width="1.6" opacity="0.8">
      <line x1="40" y1="152" x2="44" y2="166"/>
      <line x1="58" y1="150" x2="62" y2="166"/>
      <line x1="76" y1="150" x2="80" y2="166"/>
      <line x1="94" y1="152" x2="98" y2="166"/>
    </g>

    <!-- seam line with tenue glow -->
    <path d="M46,158 C66,164 88,164 108,158" stroke="#cdeaf5" stroke-width="2" opacity="0.85" filter="url(#glowD)" fill="none"/>
    <circle cx="77" cy="161" r="5" fill="#cdeaf5" opacity="0.9" filter="url(#glowD)"/>

    <!-- exposed structural hint under one lifted strap, kept minimal / non-robotic -->
    <path d="M60,182 C64,190 72,192 80,188" stroke="#241b12" stroke-width="2" fill="none" opacity="0.6"/>

    <text x="165" y="360" text-anchor="middle" font-size="11.5" fill="#3a2f20">Vendaje de cuero y tendón sobre estructura segmentada.</text>
  </g>

  <!-- ================= PANEL C: MUESTRARIO DE MATERIALES ================= -->
  <g transform="translate(800,100)">
    <rect x="0" y="0" width="330" height="360" rx="10" fill="none" stroke="#c9b98d" stroke-width="1.5"/>
    <text x="165" y="-14" text-anchor="middle" font-size="15" fill="#2a2015">03 — MUESTRARIO DE MATERIALES</text>

    <rect x="24" y="20" width="130" height="70" rx="6" fill="#6b4327"/>
    <rect x="24" y="20" width="130" height="70" rx="6" fill="url(#hatchD)" opacity="0.35"/>
    <text x="89" y="106" text-anchor="middle" font-size="11.5" fill="#3a2f20">Cuero / piel (dominante)</text>

    <rect x="176" y="20" width="130" height="70" rx="6" fill="#e7dcc0"/>
    <rect x="176" y="20" width="130" height="70" rx="6" fill="url(#stipple)" opacity="0.5"/>
    <text x="241" y="106" text-anchor="middle" font-size="11.5" fill="#3a2f20">Hueso (secundario)</text>

    <rect x="24" y="150" width="130" height="70" rx="6" fill="#17171a"/>
    <rect x="24" y="150" width="130" height="70" rx="6" fill="url(#crossHatchD)" opacity="0.5"/>
    <text x="89" y="236" text-anchor="middle" font-size="11.5" fill="#3a2f20">Obsidiana / sílex (acento)</text>

    <rect x="176" y="150" width="130" height="70" rx="6" fill="#b5651d"/>
    <rect x="176" y="150" width="130" height="70" rx="6" fill="url(#hatchD)" opacity="0.3"/>
    <text x="241" y="236" text-anchor="middle" font-size="11.5" fill="#3a2f20">Ocre rojizo (acento)</text>

    <rect x="24" y="280" width="282" height="46" rx="6" fill="#3a3a40"/>
    <rect x="24" y="280" width="90" height="46" fill="#cdeaf5" opacity="0.55" filter="url(#glowD)"/>
    <text x="165" y="308" text-anchor="middle" font-size="11" fill="#eef6f8">tecnología contenida — brillo blanco-azulado MUY tenue</text>
  </g>

  <g font-size="12.5" fill="#3a2f20">
    <text x="40" y="500">Uso: referencia de cercanía para render final y para mantener coherencia de acabados entre todas las vistas.</text>
    <text x="40" y="520">Ninguno de estos close-ups introduce diseño nuevo — solo profundiza lo ya bloqueado en Etapas 2 y 3.</text>
  </g>
</svg>
