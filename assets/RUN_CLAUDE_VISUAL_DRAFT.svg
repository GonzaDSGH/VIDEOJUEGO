<svg width="900" height="1300" viewBox="0 0 900 1300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <!-- RÛN — Stage 2 block-in (front view) — original draft by Claude. Not final art. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#221d18"/>
      <stop offset="100%" stop-color="#121010"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="1300" fill="url(#bg)"/>

  <!-- Title block -->
  <text x="450" y="48" text-anchor="middle" fill="#e8ddc7" font-size="26" letter-spacing="2">RÛN — STAGE 2 · BLOCK-IN VISTA FRONTAL</text>
  <text x="450" y="74" text-anchor="middle" fill="#a08a6f" font-size="15" font-style="italic">Draft estructural de Claude — no es arte final. Evaluar solo proporciones, orientación y jerarquía de materiales.</text>
  <line x1="220" y1="92" x2="680" y2="92" stroke="#3a2f24" stroke-width="1.5"/>

  <!-- Orientation compass -->
  <text x="150" y="130" text-anchor="middle" fill="#7a8f96" font-size="13">DERECHA de RÛN</text>
  <text x="150" y="146" text-anchor="middle" fill="#7a8f96" font-size="11">(brazo orgánico)</text>
  <line x1="150" y1="155" x2="150" y2="185" stroke="#7a8f96" stroke-width="1.5"/>

  <text x="750" y="130" text-anchor="middle" fill="#c9d6dc" font-size="13">IZQUIERDA de RÛN</text>
  <text x="750" y="146" text-anchor="middle" fill="#c9d6dc" font-size="11">(ojo + brazo protésico)</text>
  <line x1="750" y1="155" x2="750" y2="185" stroke="#c9d6dc" stroke-width="1.5"/>

  <!-- ===================== FIGURE ===================== -->

  <!-- Atlatl strap across the back (~45 deg), drawn first so torso sits above it -->
  <line x1="322" y1="255" x2="592" y2="525" stroke="#2b2620" stroke-width="20" stroke-linecap="round" opacity="0.9"/>
  <line x1="322" y1="255" x2="592" y2="525" stroke="#4a3a2c" stroke-width="12" stroke-linecap="round"/>

  <!-- Hood / hair silhouette behind head -->
  <path d="M 392 150 Q 450 105 508 150 L 520 235 Q 450 260 380 235 Z" fill="#2b2620"/>

  <!-- Head -->
  <circle cx="450" cy="182" r="56" fill="#6b5643" stroke="#2b2620" stroke-width="4"/>

  <!-- Eye implant — RÛN's LEFT eye = image RIGHT -->
  <circle cx="479" cy="178" r="10" fill="#c9d6dc" stroke="#1c1c1c" stroke-width="2"/>
  <line x1="479" y1="160" x2="479" y2="150" stroke="#c9d6dc" stroke-width="2"/>
  <line x1="495" y1="168" x2="503" y2="160" stroke="#c9d6dc" stroke-width="2"/>
  <line x1="495" y1="190" x2="503" y2="196" stroke="#c9d6dc" stroke-width="2"/>
  <!-- rupestre tracking marks near implant -->
  <path d="M 470 200 l 6 8 m 4 -8 l 6 8" stroke="#a63b23" stroke-width="2" fill="none"/>

  <!-- Neck -->
  <rect x="430" y="234" width="40" height="26" fill="#8a6b4e"/>

  <!-- Torso: shoulder IZQ (image-right, prosthetic side) ligeramente más alto/pesado -->
  <polygon points="430,258 312,272 340,472 560,472 588,248 470,258"
           fill="#5a4636" stroke="#2b2620" stroke-width="3"/>

  <!-- Chest ornament: bone plate (jerarquía secundaria: hueso) -->
  <rect x="424" y="330" width="52" height="34" rx="4" fill="#e8ddc7" stroke="#2b2620" stroke-width="2"/>
  <line x1="424" y1="347" x2="476" y2="347" stroke="#a08a6f" stroke-width="1"/>

  <!-- Ocre accent wrap across chest -->
  <line x1="345" y1="300" x2="560" y2="330" stroke="#a63b23" stroke-width="6" opacity="0.85"/>

  <!-- LEFT organic arm (image-LEFT), dominant hand -->
  <polygon points="312,272 268,330 258,410 250,505 246,540 268,540 278,500 288,410 300,335"
           fill="#6b5643" stroke="#2b2620" stroke-width="3"/>
  <ellipse cx="257" cy="552" rx="22" ry="18" fill="#e8ddc7" stroke="#2b2620" stroke-width="2"/>

  <!-- RIGHT prosthetic arm (image-RIGHT), integrated + discreet, slightly thinner -->
  <polygon points="588,248 622,300 630,400 632,505 636,538 618,538 610,500 604,400 596,310"
           fill="#4f3f30" stroke="#2b2620" stroke-width="3"/>
  <!-- subtle tech joint bands, minimal and contained -->
  <rect x="605" y="352" width="26" height="10" fill="#1c1c1c"/>
  <circle cx="618" cy="357" r="3.5" fill="#c9d6dc"/>
  <rect x="608" y="468" width="24" height="9" fill="#1c1c1c"/>
  <ellipse cx="627" cy="550" rx="20" ry="16" fill="#d8c9ac" stroke="#2b2620" stroke-width="2"/>

  <!-- Hips (narrowed per Stage 1 correction) -->
  <polygon points="340,472 355,478 470,485 545,478 560,472 545,505 355,505"
           fill="#4a3a2c" stroke="#2b2620" stroke-width="3"/>

  <!-- Fracture axe at waist/hip (dominant-hand side, image-left) -->
  <g transform="translate(348,470) rotate(18)">
    <rect x="-6" y="0" width="12" height="70" rx="3" fill="#5a4636" stroke="#2b2620" stroke-width="2"/>
    <line x1="0" y1="14" x2="0" y2="26" stroke="#a08a6f" stroke-width="2"/>
    <line x1="0" y1="34" x2="0" y2="46" stroke="#a08a6f" stroke-width="2"/>
    <polygon points="-6,-2 6,-2 20,-24 -20,-24" fill="#1c1c1c" stroke="#161311" stroke-width="1.5"/>
    <circle cx="0" cy="-13" r="2.5" fill="#c9d6dc"/>
  </g>

  <!-- Atlatl tool, angled over the RIGHT (prosthetic) shoulder, tertiary tech focus -->
  <g transform="translate(560,235) rotate(-38)">
    <rect x="-5" y="-140" width="10" height="150" rx="4" fill="#5a4636" stroke="#2b2620" stroke-width="2"/>
    <path d="M -5,-140 Q 0,-158 5,-140" fill="none" stroke="#2b2620" stroke-width="3"/>
    <circle cx="0" cy="-118" r="3" fill="#c9d6dc"/>
  </g>

  <!-- Legs: narrow stance for agility -->
  <!-- Left leg (image-left) -->
  <polygon points="355,480 430,486 415,660 402,852 372,852 358,662"
           fill="#453627" stroke="#2b2620" stroke-width="3"/>
  <polygon points="358,852 402,852 398,882 362,882" fill="#3a2f24" stroke="#2b2620" stroke-width="2"/>

  <!-- Right leg (image-right) -->
  <polygon points="470,486 545,480 542,662 528,852 498,852 485,660"
           fill="#453627" stroke="#2b2620" stroke-width="3"/>
  <polygon points="498,852 542,852 538,882 502,882" fill="#3a2f24" stroke="#2b2620" stroke-width="2"/>

  <!-- Tendon/lace accents on legs -->
  <line x1="365" y1="540" x2="410" y2="548" stroke="#a08a6f" stroke-width="1.5"/>
  <line x1="365" y1="600" x2="408" y2="606" stroke="#a08a6f" stroke-width="1.5"/>
  <line x1="490" y1="548" x2="535" y2="540" stroke="#a08a6f" stroke-width="1.5"/>
  <line x1="492" y1="606" x2="535" y2="600" stroke="#a08a6f" stroke-width="1.5"/>

  <!-- ===================== ANNOTATIONS ===================== -->
  <g font-size="16" fill="#e8ddc7">
    <line x1="489" y1="178" x2="700" y2="150" stroke="#c9d6dc" stroke-width="1"/>
    <text x="705" y="146">OJO IMPLANTADO</text>
    <text x="705" y="165" font-size="13" fill="#a08a6f">(IZQUIERDO de RÛN)</text>

    <line x1="632" y1="410" x2="720" y2="400" stroke="#e8ddc7" stroke-width="1"/>
    <text x="725" y="396">BRAZO PROTÉSICO</text>
    <text x="725" y="415" font-size="13" fill="#a08a6f">IZQUIERDO — integrado y discreto</text>
    <text x="725" y="432" font-size="13" fill="#a08a6f">(foco secundario)</text>

    <line x1="246" y1="545" x2="120" y2="580" stroke="#e8ddc7" stroke-width="1"/>
    <text x="115" y="600" text-anchor="end">MANO DOMINANTE</text>
    <text x="115" y="619" text-anchor="end" font-size="13" fill="#a08a6f">DERECHA, orgánica</text>

    <line x1="520" y1="160" x2="720" y2="230" stroke="#e8ddc7" stroke-width="1"/>
    <text x="725" y="226">ATLATL DE IMPULSO</text>
    <text x="725" y="245" font-size="13" fill="#a08a6f">diagonal ~45° sobre la espalda</text>

    <line x1="335" y1="500" x2="120" y2="480" stroke="#e8ddc7" stroke-width="1"/>
    <text x="115" y="476" text-anchor="end">HACHA DE FRACTURA</text>
    <text x="115" y="495" text-anchor="end" font-size="13" fill="#a08a6f">cintura / cadera (foco terciario)</text>

    <line x1="450" y1="700" x2="450" y2="760" stroke="#e8ddc7" stroke-width="1"/>
    <text x="450" y="780" text-anchor="middle">POSTURA DE PIERNAS ESTRECHA</text>
    <text x="450" y="799" text-anchor="middle" font-size="13" fill="#a08a6f">corrección aplicada al cerrar Etapa 1</text>
  </g>

  <!-- Footer -->
  <line x1="150" y1="1150" x2="750" y2="1150" stroke="#3a2f24" stroke-width="1"/>
  <text x="450" y="1180" text-anchor="middle" fill="#a08a6f" font-size="14">Orientación de vista frontal: el lado IZQUIERDO de RÛN aparece a la DERECHA de la imagen.</text>
  <text x="450" y="1202" text-anchor="middle" fill="#a08a6f" font-size="14">Materiales: cuero/piel (dominante) · hueso (secundario) · sílex/obsidiana, tendón, ocre (acentos) · acento tecnológico blanco azulado tenue.</text>
  <text x="450" y="1224" text-anchor="middle" fill="#a08a6f" font-size="14">Sin cyberpunk, sin neón, sin HUD holográfico, sin brazo robótico exagerado, sin circuitos visibles.</text>
  <text x="450" y="1254" text-anchor="middle" fill="#6b5643" font-size="13" font-style="italic">Artefacto de progreso — generado por Claude (Claude Code) para RÛN. No sustituye el arte final.</text>
</svg>
