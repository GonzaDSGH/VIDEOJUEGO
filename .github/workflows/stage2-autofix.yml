name: Stage2 Autofix

on:
  push:
    paths:
      - '.github/workflows/stage2-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  normalize-and-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize Stage 2 image
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='assets/STAGE2_FRONT_VIEW.jpg'
          im=Image.open(p).convert('RGB')
          target_w=max(960, im.width)
          if im.width != target_w:
              target_h=round(im.height*target_w/im.width)
              im=im.resize((target_w,target_h), Image.Resampling.LANCZOS)
          im.save(p, 'JPEG', quality=92, progressive=False, optimize=True)
          print('normalized', im.size)
          PY

      - name: Commit normalized image
        run: |
          git config user.name 'project-autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/STAGE2_FRONT_VIEW.jpg
          if git diff --cached --quiet; then
            echo 'No image changes needed.'
          else
            git commit -m 'Normalize Stage 2 image for Claude review'
            git push origin main
          fi

      - name: Retrigger Claude review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/1/comments \
            -f body='@claude Re-evaluate Stage 2 now. The artifact assets/STAGE2_FRONT_VIEW.jpg has been normalized to a baseline JPEG and enlarged for visual inspection. Read RUN_PROJECT_STATE.md and CLAUDE.md. Decide PASS or NEEDS CORRECTION and continue autonomously without asking the user for preferences. End with the HANDOFF FOR CHATGPT block.'
